name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  auditoria:
    name: Auditoria de dependências (aviso)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Não bloqueia enquanto o Next 14 tiver falhas conhecidas sem correção na linha 14:
      # a falha vira um aviso visível no resumo do CI. Ver docs/decisoes/0003-auditoria-de-dependencias.md.
      # Volta a bloquear (sem continue-on-error) após a troca para o Next 15.
      - id: audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - if: steps.audit.outcome == 'failure'
        run: echo "::warning title=Auditoria de dependências::npm audit encontrou falhas altas ou críticas. Ver o passo anterior e docs/decisoes/0003."
